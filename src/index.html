<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="HappyEnglish - 中考英语备考助手，帮助初中生高效复习英语词汇和语法">
  <title>HappyEnglish - 中考英语备考助手</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Vue SPA 容器 -->
    <div id="homeApp"></div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    // 设置 API Key
    window.minimaxApiKey = 'sk-cp-2Is80W66tsPfys3wMgI2Xd9Vn5tLGZCkVcMZNo222Nru2bSMEESIfJ6QSpLW0O9keTYnveHdQOtVX-9UY9flpuIAKJh0fOr0o_WxlTIWgVoEtz5k4EmXgUY';
    sessionStorage.setItem('minimax_api_key', window.minimaxApiKey);
  </script>
  <script src="app.js"></script>
  <script src="js/learning-companion.js"></script>
  <script src="js/trigger-engine.js"></script>
  <script src="components/companion-widget.js"></script>
  <script src="js/router.js"></script>
  <script src="js/store.js"></script>
  <script src="js/db.js"></script>
  <script src="js/spaced-repetition.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/memory-profile.js"></script>
  <script src="js/personalized-suggestions.js"></script>
  <script type="module">
    // 注意：首页不需要初始化路由，内容通过 Vue 组件直接渲染

    // 初始化触发引擎
    window.triggerEngine = new window.TriggerEngine();
    console.log('触发引擎初始化完成，状态:', window.triggerEngine.getState());

    // 监听触发引擎消息事件，用于在界面上显示伙伴消息
    if (window.learningCompanion) {
      window.learningCompanion.on('message', (data) => {
        console.log('[伙伴消息]', data.type, ':', data.message);
        // 这里可以触发 UI 显示消息
      });
    }

    // 初始化数据库
    window.db.init().then(() => {
      console.log('数据库初始化完成');
      // 初始化个性化建议服务
      if (window.personalizedSuggestions) {
        window.personalizedSuggestions.init().then(() => {
          console.log('个性化建议服务初始化完成');
        });
      }
    });

    // 从 app.js 获取词汇数据
    const vocabulary = window.vocabulary;

    // 导入掌握度模块
    import('./js/level.js').then(module => {
      const { calculateWordLevel, getWordsByLevel } = module;
      window.getWordsByLevel = getWordsByLevel;
      window.calculateWordLevel = calculateWordLevel;

      // 准备词汇数据（合并 highFrequency 和 basic）
      const allWords = [
        ...(vocabulary?.highFrequency || []),
        ...(vocabulary?.basic || [])
      ];
      window.vocabulary = { ...vocabulary, words: allWords };

      // 创建首页 Vue 组件
      const homeApp = {
        data() {
          return {
            level: 1,
            points: 0,
            learnedWords: 0,
            accuracy: 0,
            streak: 0,
            goodWords: [],
            weakWords: [],
            todayWords: 0,
            todayReviews: 0
          };
        },
        computed: {
          hasProgress() {
            return this.learnedWords > 0;
          }
        },
        methods: {
          getSize(word) {
            const wrongCount = word.progress?.wrongCount || 0;
            if (wrongCount <= 1) return 'large';
            if (wrongCount <= 3) return 'medium';
            if (wrongCount <= 5) return 'small';
            return 'tiny';
          },
          startTest() { window.location.href = '../test.html'; },
          testWord(word) { window.location.href = '../test.html?word=' + word.id; },
          goTest() { window.location.href = '../test.html'; },
          goReview() { window.location.href = 'pages/review.html'; },
          goProfile() { window.location.href = 'pages/profile.html'; },
          goStory() { window.location.href = 'pages/story.html'; },
          goBatchTest() { window.location.href = '../batch-test.html'; },
          goReport() { window.location.href = 'pages/report.html'; },
          async loadData() {
            if (window.store) {
              this.level = window.store.level?.value || 1;
              this.points = window.store.points?.value || 0;
              this.streak = window.store.streak?.value || 0;
            }

            if (typeof getWordsByLevel === 'function' && window.db) {
              const allProgress = await window.db.getAllProgress() || [];
              const allWords = window.vocabulary?.words || [];
              const grouped = getWordsByLevel(allProgress, allWords);

              this.goodWords = [...grouped.master, ...grouped.familiar];
              this.weakWords = [...grouped.weak, ...grouped.unknown];
              this.learnedWords = allWords.length;

              let correct = 0, total = 0;
              allProgress.forEach(p => {
                correct += p.correctCount || 0;
                total += (p.correctCount || 0) + (p.wrongCount || 0);
              });
              this.accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
            }

            // 加载分析统计数据
            if (window.analytics) {
              const stats = window.analytics.getLearningStats();
              this.todayWords = stats.todayWords || 0;
              this.todayReviews = stats.todayReviews || 0;
            }
          }
        },
        mounted() {
          this.loadData();
          window.addEventListener('route-change', () => this.loadData());
        },
        template: `
          <div class="home-page" id="homeApp">
            <!-- 顶部欢迎 -->
            <div class="header">
              <div class="welcome">
                <h1>HappyEnglish</h1>
                <p>中考英语备考助手</p>
              </div>
              <div class="level-badge" @click="goProfile">
                <span>Lv.{{ level }}</span>
              </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-cards">
              <div class="stat-card">
                <div class="stat-num">{{ learnedWords }}</div>
                <div class="stat-label">已学词</div>
              </div>
              <div class="stat-card">
                <div class="stat-num">{{ accuracy }}%</div>
                <div class="stat-label">正确率</div>
              </div>
              <div class="stat-card">
                <div class="stat-num">{{ streak }}</div>
                <div class="stat-label">连击</div>
              </div>
            </div>

            <!-- 今日学习统计 -->
            <div class="today-stats" v-if="todayWords > 0 || todayReviews > 0">
              <div class="today-stat">
                <span class="today-num">{{ todayWords }}</span>
                <span class="today-label">今日学习</span>
              </div>
              <div class="today-divider">|</div>
              <div class="today-stat">
                <span class="today-num">{{ todayReviews }}</span>
                <span class="today-label">今日复习</span>
              </div>
            </div>

            <!-- 开始测试按钮 -->
            <button class="btn btn-primary start-btn" @click="startTest">
              {{ hasProgress ? '继续学习' : '开始测试' }}
            </button>

            <!-- 批量测试按钮 -->
            <button class="btn btn-batch start-btn" @click="goBatchTest">
              📝 批量测试
            </button>

            <!-- 故事入口 -->
            <div class="story-entry" @click="goStory">
              <div class="story-icon">📖</div>
              <div class="story-info">
                <h3>今日故事</h3>
                <p>用故事记住单词</p>
              </div>
              <div class="story-arrow">→</div>
            </div>

            <!-- 学习报告入口 -->
            <div class="report-entry" @click="goReport">
              <div class="report-icon">📊</div>
              <div class="report-info">
                <h3>学习报告</h3>
                <p>查看进步轨迹</p>
              </div>
              <div class="report-arrow">→</div>
            </div>

            <!-- 热力词云 -->
            <div class="word-cloud-section">
              <h3>掌握较好 <span class="count">({{ goodWords.length }}词)</span></h3>
              <div class="word-cloud green">
                <span
                  v-for="word in goodWords"
                  :key="word.id"
                  :class="'size-' + getSize(word)"
                  :style="{ color: word.level === 'master' ? '#1e8449' : '#67C23A' }"
                  @click="testWord(word)"
                >
                  {{ word.word }}
                </span>
                <div v-if="goodWords.length === 0" class="empty-tip">
                  还没有掌握很好的词，继续加油！
                </div>
              </div>

              <h3 style="margin-top: 24px;">需要加强 <span class="count">({{ weakWords.length }}词)</span></h3>
              <div class="word-cloud red">
                <span
                  v-for="word in weakWords"
                  :key="word.id"
                  :class="'size-' + getSize(word)"
                  :style="{ color: word.level === 'unknown' ? '#c0392b' : '#e74c3c' }"
                  @click="testWord(word)"
                >
                  {{ word.word }}
                </span>
                <div v-if="weakWords.length === 0" class="empty-tip">
                  太棒了！薄弱词已清空！
                </div>
              </div>
            </div>

            <!-- 底部导航 -->
            <div class="tab-bar">
              <div class="tab-item active">
                <span class="icon">🏠</span>
                <span class="text">首页</span>
              </div>
              <div class="tab-item" @click="goTest">
                <span class="icon">📝</span>
                <span class="text">测试</span>
              </div>
              <div class="tab-item" @click="goReview">
                <span class="icon">📖</span>
                <span class="text">复习</span>
              </div>
              <div class="tab-item" @click="goProfile">
                <span class="icon">👤</span>
                <span class="text">我的</span>
              </div>
            </div>
          </div>
        `
      };

      Vue.createApp(homeApp).mount('#homeApp');
    });
  </script>
  <style>
    .home-page { padding: 16px; padding-bottom: 80px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .welcome h1 { font-size: 24px; color: var(--primary); margin: 0; }
    .welcome p { font-size: 14px; color: var(--text-secondary); margin: 4px 0 0; }
    .level-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--text-secondary); }

    .start-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      margin-bottom: 12px;
    }
    .btn-batch {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin-bottom: 20px;
    }
    .btn-batch:active {
      transform: scale(0.98);
    }

    .word-cloud-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .word-cloud-section h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .word-cloud-section .count {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: normal;
    }

    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
      background: #F5F7FA;
      border-radius: 12px;
      min-height: 80px;
    }
    .word-cloud span {
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 6px;
      transition: transform 0.2s;
    }
    .word-cloud span:hover { transform: scale(1.1); }
    .word-cloud.green span { background: rgba(103, 194, 58, 0.1); }
    .word-cloud.red span { background: rgba(245, 108, 108, 0.1); }

    .size-large { font-size: 28px; font-weight: 700; }
    .size-medium { font-size: 20px; font-weight: 600; }
    .size-small { font-size: 16px; }
    .size-tiny { font-size: 13px; }

    .empty-tip {
      width: 100%;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      padding: 20px;
    }

    /* 故事入口样式 */
    .story-entry {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .story-entry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
    }

    .story-entry:active {
      transform: scale(0.98);
    }

    .story-icon {
      font-size: 36px;
      margin-right: 16px;
    }

    .story-info {
      flex: 1;
    }

    .story-info h3 {
      color: white;
      font-size: 18px;
      margin: 0 0 4px;
    }

    .story-info p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      margin: 0;
    }

    .story-arrow {
      color: white;
      font-size: 20px;
      opacity: 0.8;
    }
  </style>
</body>
</html>
